<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>My Performance Scorecard</title>
<style>
:root{--bg:#0d1117;--bg-elevated:#151b23;--border:#2a313c;--text-primary:#e6edf3;--text-secondary:#9198a1;--text-tertiary:#6e7681;--accent:#4493f8;--danger:#f85149;--warning:#d29922;--info:#58a6ff;--success:#3fb950;--neutral:#8b949e;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text-primary);font-size:14px;line-height:1.5;padding:24px 32px 64px}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:22px;font-weight:600;margin:0 0 6px}h2{font-size:16px;font-weight:600;margin:0 0 4px}p{margin:0}
.text-secondary{color:var(--text-secondary)}.text-tertiary{color:var(--text-tertiary);font-size:12px}
.hide{display:none}.divider{border:none;border-top:1px solid var(--border);margin:24px 0}
select,input{background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;height:34px;width:100%;font-family:inherit}
button{height:32px;padding:0 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);font-family:inherit}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);height:36px;width:100%;margin-top:18px}
.btn-primary:disabled{opacity:.5;cursor:default}
.btn-neutral{background:transparent;color:var(--text-primary)}
.login{max-width:400px;margin:12vh auto 0;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:24px}
.login label{display:block;font-size:12px;color:var(--text-tertiary);margin:14px 0 4px}
.err{color:var(--danger);margin-top:12px;min-height:20px;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tabs{display:flex;gap:4px;margin:12px 0 14px;border-bottom:1px solid var(--border)}
.tab{padding:0 18px;height:36px;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;background:transparent;color:var(--text-secondary);font-size:14px;font-weight:500}
.tab:hover{color:var(--text-primary)}
.tab.on{background:var(--bg-elevated);border-color:var(--border);color:var(--text-primary);box-shadow:0 2px 0 var(--accent) inset}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:16px 0}
.stat{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.stat .value{font-size:22px;font-weight:600}.stat .label{margin-top:4px;font-size:12px;color:var(--text-secondary)}
.success{color:var(--success)}.warning{color:var(--warning)}.danger{color:var(--danger)}
.card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600}
.card-header .trailing{font-weight:400;color:var(--text-secondary)}
.card-body{padding:14px}.card-body .sub{color:var(--text-tertiary);font-size:12px;margin-bottom:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
svg{width:100%;height:auto;display:block}
.section-title{margin:24px 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
table.framed{border:1px solid var(--border);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--text-secondary);font-weight:600;font-size:12px;background:var(--bg-elevated)}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right}
tr.tot td{font-weight:600;background:var(--bg-elevated)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.dot.danger{background:var(--danger)}.dot.warning{background:var(--warning)}.dot.info{background:var(--info)}.dot.success{background:var(--success)}.dot.accent{background:var(--accent)}.dot.neutral{background:var(--neutral)}
.callout{border-left:3px solid var(--neutral);background:var(--bg-elevated);border-radius:6px;padding:10px 14px;margin:12px 0}
.callout .title{font-weight:600;font-size:13px;margin-bottom:4px}.callout .body{font-size:13px;color:var(--text-secondary)}
.wide{overflow-x:auto;border:1px solid var(--border);border-radius:8px}
.wide table{min-width:max-content}.wide th{white-space:normal;min-width:80px;vertical-align:bottom}
.wide td:first-child,.wide th:first-child{position:sticky;left:0;background:var(--bg-elevated);z-index:1}
td.z,span.z{color:var(--text-tertiary)}
.mt td:nth-child(3){padding-left:32px}
@media(max-width:900px){body{padding:16px}.stat-grid,.grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="login">
  <h1>My Performance Scorecard</h1>
  <div class="text-tertiary" style="margin-top:4px">October 2026. Select your name and enter the password you were given. Your data is decrypted only in this browser.</div>
  <label for="who">Your name</label>
  <select id="who"></select>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="off" placeholder="xxxx-xxxx-xxxx">
  <button id="go" class="btn-primary">View my scorecard</button>
  <div id="err" class="err"></div>
</div>
<div id="app" class="hide"></div>
</div>

const ITER = 600000;
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const names = Object.keys(ENC).sort();
$('who').innerHTML = names.map(n => `<option>${n}</option>`).join('');

async function decrypt(name, password){
  const e = ENC[name];
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(e.s), iterations:ITER, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(e.i)}, key, b64(e.c));
  return JSON.parse(new TextDecoder().decode(buf));
}

$('go').onclick = async () => {
  $('err').textContent = '';
  if (!window.crypto || !crypto.subtle) { $('err').textContent = 'This browser cannot decrypt here. Open the file in Chrome, Edge or Safari (or over https).'; return; }
  const pw = $('pw').value;
  if (!pw) { $('err').textContent = 'Enter your password.'; return; }
  $('go').disabled = true; $('go').textContent = 'Checking...';
  try { render(await decrypt($('who').value, pw)); }
  catch (e) { $('err').textContent = 'Wrong password for this name. Please try again.'; }
  $('go').disabled = false; $('go').textContent = 'View my scorecard';
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });

const f2 = x => Number(x).toFixed(2), pc = x => (x*100).toFixed(1) + '%', n0 = x => Number(x).toLocaleString('en-US');
const cls = v => v >= 4 ? 'success' : v < 3 ? 'danger' : 'warning';
const COL = {success:'#3fb950', warning:'#d29922', danger:'#f85149', info:'#58a6ff', accent:'#4493f8'};
const dl = d => d + ' Oct';

// Generic SVG charts. i = column index in a day row; days plotted by day-of-month (1..31).
function chartFrame(W,H,l,b,t,r,max,fmt,ref,div=4){
  const iw=W-l-r, ih=H-t-b, y=v=>t+ih-ih*v/max, x=d=>l+iw*(d-1)/30;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(let k=0;k<=div;k++){const v=max*k/div;s+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="#2a313c"/><text x="${l-6}" y="${y(v)+3}" font-size="10" text-anchor="end" fill="#6e7681">${fmt(v)}</text>`}
  [1,5,10,15,20,25,30].forEach(d=>{s+=`<text x="${x(d)}" y="${H-8}" font-size="10" text-anchor="middle" fill="#6e7681">${d}</text>`});
  if(ref!=null) s+=`<line x1="${l}" x2="${W-r}" y1="${y(ref)}" y2="${y(ref)}" stroke="#f85149" stroke-dasharray="4 3"/><text x="${W-r}" y="${y(ref)-4}" font-size="9" text-anchor="end" fill="#f85149">Below-3 line</text>`;
  return {s,x,y,iw,ih,W,H,l,t,b};
}
function barChart(days,i,color,fmt=v=>Math.round(v)){
  const vals=days.map(d=>d[i]||0), max=niceMax(Math.max(1,...vals));
  const f=chartFrame(520,200,40,26,8,10,max,fmt), bw=f.iw/31;
  let s=f.s;
  days.forEach((d,k)=>{const v=vals[k], h=f.ih*v/max;
    s+=`<rect x="${f.x(d[0])-bw/2+1}" y="${f.y(v)}" width="${Math.max(2,bw-2)}" height="${h}" rx="1" fill="${color}"><title>${dl(d[0])}: ${n0(v)}</title></rect>`});
  return s+`</svg>`;
}
function lineChart(days,i,color,{max,fmt=v=>v,ref,div=4}={}){
  const vals=days.map(d=>d[i]), top=max||niceMax(Math.max(1,...vals.filter(v=>v!=null)));
  const f=chartFrame(520,200,40,26,8,10,top,fmt,ref,div);
  let s=f.s, seg=[];
  const flush=()=>{if(seg.length>1)s+=`<polyline fill="none" stroke="${color}" stroke-width="2" points="${seg.join(' ')}"/>`;seg=[]};
  days.forEach((d,k)=>{const v=vals[k]; if(v==null){flush();return}
    seg.push(f.x(d[0])+','+f.y(v));
    s+=`<circle cx="${f.x(d[0])}" cy="${f.y(v)}" r="3" fill="${color}"><title>${dl(d[0])}: ${fmt(v)}</title></circle>`});
  flush();
  return s+`</svg>`;
}
function niceMax(m){const raw=Math.max(1,m)/4,p=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/p;return Math.max(4,(n<=1?1:n<=2?2:n<=5?5:10)*p*4)}

  const dot=s=>{const l=String(s||'').toLowerCase();return `<span class="dot ${l.startsWith('present')?'success':'warning'}"></span>${s||''}`};
  $('login').classList.add('hide'); $('app').classList.remove('hide');

    `<tr class="tot"><td>Month total</td>${cols.slice(1).map(c=>`<td class="${c.l?'':'num'}">${c.tf?c.tf(tt):''}</td>`).join('')}</tr></table></div>`;
  const fix=c=>{ if(c.h==='Day') c.l=1; return c };
  const daily=[
    {h:'Day',l:1,f:()=>''},
    {h:'Status',l:1,f:d=>dot(d[1]),tf:()=>''},
    C('Cases closed',12,N), C('Rating (of 5)',14,N), C('Open source LANs',19,N), C('Coverage',11,P), C('Break time',13,N),
    C('Remarks',24,T,{l:1,noTot:1})];
  const all=[
    {h:'Day',l:1,f:()=>''},
    {h:'Status',l:1,f:d=>dot(d[1]),tf:()=>''},
    C('Same-day allocated LANs',2,N), C('Closed from same-day allocated',3,N), C('Same-day coverage',4,P),
    C('Total open LANs',5,N), C('Number requirement LANs closed',6,N), C('Address requirement LANs closed',7,N), C('Paid LANs',8,N),
    C('LH reflecting LANs closed',9,N), C('LH not-reflecting LANs closed',10,N), C('Coverage',11,P),
    C('Total cases closed',12,N), C('Break time',13,N), C('Case closure rating',14,N),
    C('No-added LAN count',15,N), C('No-added count',16,N), C('No per LAN',17,R), C('Number contribution',18,P),
    C('Open source: No-added LANs',19,N), C('Open source: No-added count',20,N), C('Open source: No per LAN',21,R), C('Open source: Number contribution',22,P),
    C('BOD LAN count',23,N), C('Remarks',24,T,{l:1,noTot:1})];

  const stat=(v,l,c='')=>`<div class="stat"><div class="value ${c}">${v}</div><div class="label">${l}</div></div>`;
  const panel=(color,title,trail,sub,svg)=>`<div class="card"><div class="card-header"><span><span class="dot ${color}"></span>${title}</span><span class="trailing">${trail}</span></div><div class="card-body"><div class="sub">${sub}</div>${svg}<div class="text-tertiary" style="margin-top:4px">X: day of October</div></div></div>`;

  $('app').innerHTML=`
  <div class="top"><div><h1>${a.name}</h1><div class="text-secondary">October 2026 &middot; ${a.team} team</div></div>
  <button class="btn-neutral" onclick="location.reload()">Lock</button></div>
  <div class="tabs" id="tabs"><button class="tab on" data-t="t1">Summary</button><button class="tab" data-t="t2">Day by day</button><button class="tab" data-t="t3">All details</button></div>

  <div id="t1">
   <p class="text-secondary">Your October 2026 performance. Final rating = 45% cases closed rating + 45% open source number + 10% discipline, each scored out of 5.</p>
   <div class="stat-grid">
    ${stat(f2(a.final),'Final rating (out of 5) &middot; '+verdict,cls(a.final))}
    ${stat(f2(a.cases),'Cases closed rating &middot; 45% of final',cls(a.cases))}
    ${stat(pc(a.os),'Open source number &middot; score '+a.sOS+' of 5 &middot; 45% of final',cls(a.sOS))}
    ${stat(a.sDisc,'Discipline score &middot; 10% of final',cls(a.sDisc))}
   </div>
   <div class="stat-grid">
    ${stat(n0(t.cases),'Cases closed in the month')}
    ${stat(worked,'Working days (cases closed)')}
    ${stat(present+' / '+a.leave,'Days present / leave days')}
    ${stat(a.incentive?'Rs '+n0(a.incentive):'None','Incentive'+(a.incentive?(a.eligible==='Yes'?' (eligible)':' (not eligible)'):'')+' &middot; '+a.below3+' day(s) rated below 3',a.incentive?'success':'')}
   </div>
   <hr class="divider">
   <div class="section-title"><h2>How your final rating is made</h2></div>
   <table class="framed">
    <tr><th>Part</th><th class="num">Weight</th><th class="num">Your result</th><th class="num">Score (of 5)</th><th class="num">Adds to final</th></tr>
    <tr><td><span class="dot ${cls(a.cases)}"></span>Cases closed rating</td><td class="num">45%</td><td class="num">${f2(a.cases)}</td><td class="num">${f2(a.cases)}</td><td class="num">${f2(.45*a.cases)}</td></tr>
    <tr><td><span class="dot ${cls(a.sOS)}"></span>Open source number</td><td class="num">45%</td><td class="num">${pc(a.os)}</td><td class="num">${a.sOS}</td><td class="num">${f2(.45*a.sOS)}</td></tr>
    <tr><td><span class="dot ${cls(a.sDisc)}"></span>Discipline (login and break)</td><td class="num">10%</td><td class="num">${dash}</td><td class="num">${a.sDisc}</td><td class="num">${f2(.1*a.sDisc)}</td></tr>
    <tr class="tot"><td>Final rating</td><td class="num">100%</td><td class="num"></td><td class="num"></td><td class="num">${f2(a.final)}</td></tr>
   </table>
   <div class="text-tertiary" style="margin-top:6px">Open source score: 20%+ = 5, 15%+ = 4, 12%+ = 3, 8%+ = 2, below 8% = 1.</div>
   <hr class="divider">
   <div class="section-title"><h2>Trends through the month</h2><p class="text-secondary">Each panel shows one measure for every working day.</p></div>
   <div class="grid-2">
    ${panel('accent','Cases closed per day',n0(t.cases)+' total','How many cases you closed each day.',barChart(days,12,COL.accent))}
    ${panel('success','Daily case closure rating','Average '+f2(a.cases),'Rating for each working day. Days under the red line need attention.',lineChart(days,14,COL.success,{max:5,ref:3,div:5}))}
    ${panel('info','Open source LANs per day',n0(t.osLan)+' total','No-added LANs coming from open source numbers.',barChart(days,19,COL.info))}
    ${panel('warning','Coverage per day','Month '+pc(t.cov),'Share of open LANs closed each day.',lineChart(days,11,COL.warning,{max:1,fmt:v=>Math.round(v*100)+'%'}))}
   </div>
   <hr class="divider">
   <div class="section-title"><h2>Month totals</h2></div>
   <table class="framed mt">
    <tr><td>Same-day allocated LANs</td><td class="num">${N(t.sdAlloc)}</td><td>Closed from same-day allocated</td><td class="num">${N(t.sdClosed)}</td></tr>
    <tr><td>Same-day coverage</td><td class="num">${P(t.sdCov)}</td><td>Coverage (LH reflecting / open LANs)</td><td class="num">${P(t.cov)}</td></tr>
    <tr><td>Total open LANs (sum of days)</td><td class="num">${N(t.openLan)}</td><td>Number requirement LANs closed</td><td class="num">${N(t.numReq)}</td></tr>
    <tr><td>Address requirement LANs closed</td><td class="num">${N(t.addrReq)}</td><td>Paid LANs</td><td class="num">${N(t.paid)}</td></tr>
    <tr><td>Open source No-added LANs</td><td class="num">${N(t.osLan)}</td><td>Open source No-added count</td><td class="num">${N(t.osCnt)}</td></tr>
    <tr><td>LH reflecting LANs closed</td><td class="num">${N(t.lhRefl)}</td><td>BOD LAN count</td><td class="num">${N(t.bod)}</td></tr>
   </table>
  </div>

  <div id="t2" class="hide"><div class="section-title"><h2>Day by day</h2><p class="text-secondary">Every working day in October. A dash means the workbook has no value for that day (for example no cases closed, or leave).</p></div><div style="margin-top:10px">${tbl(daily)}</div></div>

  <div id="t3" class="hide"><div class="section-title"><h2>All details</h2><p class="text-secondary">Every column from the performance workbook. Scroll sideways to see all of them.</p></div><div style="margin-top:10px">${tbl(all)}</div></div>

  <div class="text-tertiary" style="margin-top:24px">Source: Executive Level Performance workbook, October 2026. Questions on your score? Speak to your manager.</div>`;
  $('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    [...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));
    ['t1','t2','t3'].forEach(id=>$(id).classList.toggle('hide',id!==b.dataset.t))};
}
</script>
</body>
</html>
