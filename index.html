<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>My Performance Scorecard</title>
<style>
:root{--ff:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--r:18px}
[data-theme=dark]{--bg:#0a0f1f;--card:#121a33;--card2:#18224a;--border:rgba(255,255,255,.08);--text:#eef1ff;--muted:#a3adcf;--faint:#6f7aa3;--accent:#7c8cff;--accent2:#22d3ee;--good:#34d399;--warn:#fbbf24;--bad:#fb7185;--shadow:0 12px 32px rgba(0,0,0,.35);--glow1:rgba(124,140,255,.20);--glow2:rgba(34,211,238,.12)}
[data-theme=light]{--bg:#f3f5fc;--card:#ffffff;--card2:#f5f6fd;--border:rgba(20,30,70,.09);--text:#141a33;--muted:#58628a;--faint:#8b94b4;--accent:#4f5bd5;--accent2:#0891b2;--good:#0f9d6a;--warn:#b7791f;--bad:#e11d48;--shadow:0 10px 28px rgba(30,40,90,.09);--glow1:rgba(79,91,213,.14);--glow2:rgba(8,145,178,.10)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--ff);font-size:15px;line-height:1.55;color:var(--text);font-variant-numeric:tabular-nums;
 background:radial-gradient(900px 500px at 8% -10%,var(--glow1),transparent 60%),radial-gradient(800px 480px at 100% 0%,var(--glow2),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 64px}
h1,h2,h3,p{margin:0}
h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.hide{display:none!important}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.tone-good{--tone:var(--good)}.tone-warn{--tone:var(--warn)}.tone-bad{--tone:var(--bad)}.tone-accent{--tone:var(--accent)}.tone-info{--tone:var(--accent2)}
/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;box-shadow:0 6px 16px var(--glow1)}
.logo svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ctrl{display:flex;gap:8px;align-items:center}
.btn{height:36px;padding:0 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font:600 13px var(--ff);cursor:pointer;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:7px;transition:transform .15s,border-color .15s}
.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff;width:100%;height:46px;font-size:15px;margin-top:20px;justify-content:center;box-shadow:0 10px 24px var(--glow1)}
.btn-primary:disabled{opacity:.6;cursor:wait}
/* login */
.login{max-width:430px;margin:9vh auto 0;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:32px;box-shadow:var(--shadow)}
.login .logo{width:48px;height:48px;border-radius:15px;margin-bottom:16px}.login .logo svg{width:26px;height:26px}
.login h1{font-size:26px;letter-spacing:-.02em}
.login label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:18px 0 6px;text-transform:uppercase;letter-spacing:.06em}
select,input{width:100%;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--text);font:500 15px var(--ff);outline:none}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow1)}
.err{color:var(--bad);margin-top:12px;min-height:20px;font-size:14px}
.mnav{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;margin-bottom:6px;scrollbar-width:thin}
.pill{flex:none;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted);font:600 14px var(--ff);cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,border-color .15s}
.pill:hover{transform:translateY(-1px);border-color:var(--accent);color:var(--text)}
.pill.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 6px 16px var(--glow1)}
.pill .dot{margin:0;width:8px;height:8px}.pill.on .dot{box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mcard{text-align:left;padding:18px 20px;cursor:pointer;font:inherit;color:inherit;border-top:4px solid var(--tone);transition:transform .15s,box-shadow .15s}
.mcard:hover{transform:translateY(-3px);box-shadow:0 16px 36px var(--glow1)}
.mcard .mt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.mcard .mv{font-size:38px;font-weight:800;letter-spacing:-.03em;color:var(--tone);margin:6px 0 8px;line-height:1}.mcard .mv small{font-size:14px;color:var(--muted);font-weight:600;letter-spacing:0}
.mbar{height:8px;border-radius:999px;background:var(--card2);overflow:hidden}.mbar i{display:block;height:100%;background:var(--tone);border-radius:999px}
.mcard .ms{font-size:13px;color:var(--muted);margin-top:10px;min-height:20px}.mcard .go{font-size:13px;font-weight:700;color:var(--accent);margin-top:8px}
.notice{padding:12px 16px;border-radius:14px;margin-bottom:18px;background:color-mix(in srgb,var(--accent2) 14%,var(--card));border:1px solid color-mix(in srgb,var(--accent2) 35%,transparent);font-size:14px}
/* tabs */
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:var(--card);border:1px solid var(--border);margin:0 0 20px}
.tab{height:36px;padding:0 20px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:600 14px var(--ff);cursor:pointer}
.tab.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px var(--glow1)}
/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.sect{margin-top:34px}.sect>.head{margin-bottom:14px}
.fade{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;padding:28px;border-radius:26px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);box-shadow:var(--shadow)}
.hero:before{content:"";position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,var(--glow1),transparent 70%)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:6px 0 8px}
.gauge-row{display:flex;gap:22px;align-items:center;margin-top:18px;flex-wrap:wrap}
.gauge{position:relative;width:170px;height:170px;flex:none}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.gauge .num{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--tone)}
.gauge .of{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;background:color-mix(in srgb,var(--tone) 16%,transparent);color:var(--tone)}
.chip.sm{font-size:12px;padding:3px 10px}
.formula{color:var(--muted);font-size:13px;margin-top:10px;max-width:330px}
.ring-bg{stroke:var(--border);fill:none}.ring-fg{fill:none;stroke:var(--tone);stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.7,.2,1)}
.parts{display:grid;gap:12px;align-content:center;position:relative}
.part{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:16px;background:color-mix(in srgb,var(--card) 70%,transparent);border:1px solid var(--border);backdrop-filter:blur(6px)}
.part .ringbox{position:relative;width:64px;height:64px;flex:none}
.part .ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.part .ringbox b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;color:var(--tone)}
.part .t{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.part .v{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15;color:var(--tone)}
.part .d{font-size:13px;color:var(--muted)}
/* incentive banner */
.banner{display:flex;align-items:center;gap:18px;margin-top:20px;padding:20px 24px;border-radius:22px;border:1px solid color-mix(in srgb,var(--tone) 40%,transparent);background:linear-gradient(120deg,color-mix(in srgb,var(--tone) 18%,var(--card)),var(--card))}
.banner .ic{width:54px;height:54px;border-radius:50%;background:var(--tone);display:grid;place-items:center;flex:none;box-shadow:0 8px 20px color-mix(in srgb,var(--tone) 40%,transparent)}
.banner .ic svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.banner .tt{font-size:20px;font-weight:800;letter-spacing:-.01em}
.banner .amt{margin-left:auto;text-align:right}.banner .amt b{display:block;font-size:30px;font-weight:800;color:var(--tone);letter-spacing:-.02em}
.banner .amt span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
/* criteria cards */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.crit{padding:18px;border-top:4px solid var(--tone)}
.crit .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.crit .n{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.crit .val{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:8px 0 2px;color:var(--tone)}
.crit .need{font-size:13px;color:var(--muted)}
/* stats */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{padding:18px;display:flex;align-items:center;gap:14px}
.stat .ico{width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--tone) 16%,transparent);display:grid;place-items:center;flex:none}
.stat .ico svg{width:22px;height:22px;stroke:var(--tone);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
/* focus */
.focus{display:grid;gap:12px}
.fcard{display:flex;gap:16px;padding:18px 20px;border-left:5px solid var(--tone)}
.fcard .no{width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--tone) 18%,transparent);color:var(--tone);display:grid;place-items:center;font-weight:800;flex:none}
.fcard .t{font-weight:700;font-size:16px}
.fcard .b{color:var(--muted);font-size:14px;margin-top:3px}
.fcard ul{margin:6px 0 0 18px;padding:0;color:var(--muted);font-size:14px}
/* stacked bar */
.stack{display:flex;height:22px;border-radius:999px;overflow:hidden;background:var(--card2);border:1px solid var(--border);margin:14px 0 10px}
.stack i{display:block;height:100%;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px;color:var(--muted)}
.legend span b{color:var(--text)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;background:var(--tone)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 16px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left}th.l,td.l{text-align:left}
th{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--card2)}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:800;background:var(--card2)}
.tablewrap{overflow:hidden;border-radius:var(--r)}
.wide{overflow-x:auto}.wide table{min-width:max-content}.wide th{white-space:normal;min-width:90px;vertical-align:bottom}
.wide td:first-child,.wide th:first-child{position:sticky;left:0;background:var(--card);z-index:1}.wide th:first-child{background:var(--card2)}
td.z,span.z{color:var(--faint)}
/* charts */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart{padding:18px 18px 12px}
.chart .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chart .h b{font-size:16px}.chart .h span{font-size:13px;font-weight:700;color:var(--tone)}
.chart .s{font-size:13px;color:var(--muted);margin:2px 0 8px}
.chart svg{width:100%;height:auto;display:block}.chart .x{font-size:12px;color:var(--faint);text-align:center}
/* totals */
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile{padding:14px 16px}.tile span{font-size:13px;color:var(--muted)}.tile b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em}
.foot{margin-top:34px;color:var(--faint);font-size:12.5px;text-align:center}
@media(max-width:900px){.hero{grid-template-columns:1fr;padding:20px}.grid3,.grid2{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}.banner{flex-wrap:wrap}.banner .amt{margin-left:0;text-align:left}.hero h1{font-size:25px}.wrap{padding:14px 12px 48px}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}.ring-fg,.stack i{transition:none}}
</style>
</head>

<div class="wrap">
<div class="bar">
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-7"/></svg></div><span>My Performance Scorecard</span></div>
  <div class="ctrl"><button class="btn" id="theme" type="button" title="Switch light or dark"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg><span id="themeLbl">Light mode</span></button><button class="btn hide" id="lock" type="button" onclick="location.reload()"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>Lock</button></div>
</div>
<div id="login" class="login fade">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-7"/></svg></div>
  <h1>Welcome back</h1>
  <div class="sub" style="margin-top:6px">October 2026. Select your name and enter the password you were given. Your data opens only in this browser.</div>
  <label for="who">Your name</label>
  <select id="who"></select>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="off" placeholder="xxxx-xxxx-xxxx">
  <button id="go" class="btn btn-primary">View my scorecard</button>
  <div id="err" class="err"></div>
</div>
<div id="app" class="hide"></div>
</div>

const ITER = 600000;
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const names = Object.keys(ENC).sort();
$('who').innerHTML = names.map(n => `<option>${n}</option>`).join('');

async function decrypt(name, password){
  const e = ENC[name];
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(e.s), iterations:ITER, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(e.i)}, key, b64(e.c));
  return JSON.parse(new TextDecoder().decode(buf));
}

$('go').onclick = async () => {
  $('err').textContent = '';
  if (!window.crypto || !crypto.subtle) { $('err').textContent = 'This browser cannot decrypt here. Open the file in Chrome, Edge or Safari (or over https).'; return; }
  const pw = $('pw').value;
  if (!pw) { $('err').textContent = 'Enter your password.'; return; }
  $('go').disabled = true; $('go').textContent = 'Checking...';
  try { render(await decrypt($('who').value, pw)); }
  catch (e) { $('err').textContent = 'Wrong password for this name. Please try again.'; }
  $('go').disabled = false; $('go').textContent = 'View my scorecard';
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });

const f2 = x => Number(x).toFixed(2), pc = x => (x*100).toFixed(1) + '%', n0 = x => Number(x).toLocaleString('en-US');
const tone = v => v >= 4 ? 'good' : v < 3 ? 'bad' : 'warn';
let MON='Oct';
const dl = d => d + ' ' + MON;
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- theme (light / dark) ----
function setTheme(t){ document.documentElement.dataset.theme=t; $('themeLbl').textContent = t==='dark'?'Light mode':'Dark mode'; try{localStorage.setItem('sc-theme',t)}catch(e){} }

// ---- rings ----
function ring(val,max,size,stroke,id){
  const r=(size-stroke)/2, C=2*Math.PI*r, p=Math.max(0,Math.min(1,val/max));
  const start = REDUCED ? C*(1-p) : C;
  return `<svg viewBox="0 0 ${size} ${size}"><circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/><circle class="ring-fg" data-off="${C*(1-p)}" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" stroke-dasharray="${C}" stroke-dashoffset="${start}"/></svg>`;
}

// ---- charts (inline SVG, theme aware) ----
function niceMax(m){const raw=Math.max(1,m)/4,p=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/p;return Math.max(4,(n<=1?1:n<=2?2:n<=5?5:10)*p*4)}
function frame(max,fmt,ref,div=4){
  const W=520,H=210,l=40,b=26,t=10,r=10, iw=W-l-r, ih=H-t-b, y=v=>t+ih-ih*v/max, x=d=>l+iw*(d-1)/30;
  let s='';
  for(let k=0;k<=div;k++){const v=max*k/div;s+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--border)"/><text x="${l-8}" y="${y(v)+4}" font-size="11" text-anchor="end" style="fill:var(--faint)">${fmt(v)}</text>`}
  [1,5,10,15,20,25,30].forEach(d=>{s+=`<text x="${x(d)}" y="${H-8}" font-size="11" text-anchor="middle" style="fill:var(--faint)">${d}</text>`});
  if(ref!=null) s+=`<line x1="${l}" x2="${W-r}" y1="${y(ref)}" y2="${y(ref)}" stroke-dasharray="5 4" style="stroke:var(--bad)"/><text x="${W-r}" y="${y(ref)-5}" font-size="10" text-anchor="end" style="fill:var(--bad)">Below-3 line</text>`;
  return {s,x,y,iw,ih,W,H,l,t,b};
}
const grad=(id,c)=>`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${c}"/><stop offset="1" style="stop-color:${c};stop-opacity:.25"/></linearGradient></defs>`;
function barChart(days,i,c,id,fmt=v=>Math.round(v)){
  const vals=days.map(d=>d[i]||0), max=niceMax(Math.max(1,...vals)), f=frame(max,fmt), bw=f.iw/31;
  let s=`<svg viewBox="0 0 ${f.W} ${f.H}" role="img">${grad(id,c)}`+f.s;
  days.forEach((d,k)=>{const v=vals[k], h=f.ih*v/max;
    s+=`<rect x="${f.x(d[0])-bw/2+1.5}" y="${f.y(v)}" width="${Math.max(3,bw-3)}" height="${h}" rx="3" fill="url(#${id})"><title>${dl(d[0])}: ${n0(v)}</title></rect>`});
  return s+'</svg>';
}
function lineChart(days,i,c,id,{max,fmt=v=>v,ref,div=4}={}){
  const vals=days.map(d=>d[i]), top=max||niceMax(Math.max(1,...vals.filter(v=>v!=null))), f=frame(top,fmt,ref,div);
  let s=`<svg viewBox="0 0 ${f.W} ${f.H}" role="img">${grad(id,c)}`+f.s, seg=[];
  const base=f.y(0);
  const flush=()=>{ if(seg.length>1){ const pts=seg.map(p=>p.join(',')).join(' ');
      s+=`<polygon points="${seg[0][0]},${base} ${pts} ${seg[seg.length-1][0]},${base}" fill="url(#${id})" opacity=".45"/><polyline fill="none" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" style="stroke:${c}" points="${pts}"/>`; } seg=[]; };
  days.forEach((d,k)=>{const v=vals[k]; if(v==null){flush();return} seg.push([f.x(d[0]),f.y(v)]);});
  flush();
  days.forEach((d,k)=>{const v=vals[k]; if(v==null) return;
    s+=`<circle cx="${f.x(d[0])}" cy="${f.y(v)}" r="4" stroke-width="2" style="fill:${c};stroke:var(--card)"><title>${dl(d[0])}: ${fmt(v)}</title></circle>`});
  return s+'</svg>';
}

function v2(a){

  const verdict=a.final>=4?'Excellent':a.final>=3?'Good':'Needs improvement';
  const dash='<span class="z">&ndash;</span>';
  const V=(x,fmt)=> (x===null||x===undefined||x==='') ? dash : (fmt?fmt(x):n0(x));
  const R=x=>V(x,x=>Number(x).toFixed(2)), P=x=>V(x,pc), N=x=>V(x), T=x=>x?String(x).replace(/</g,'&lt;'):dash;

  // incentive logic (from Team Incentive sheet)
  const elig=a.eligible==='Yes';

  const fails=[];
  if(!okOS) fails.push('Open source number is '+pc(a.os)+', needs 12% or above');

  const items=[];

    items.push({g,c:a.cases<3?'bad':a.cases<4?'warn':'accent',t:'Case closure rating: '+f2(a.cases)+' of 5',
      b:(lowDays.length?'Days rated below 3: '+lowDays.map(dl).join(', ')+'. Improving days like these is the fastest way to lift your average. ':'Aim to keep every working day rated 4 or 5. ')+'Reaching 5 would add up to '+f2(g)+' to your final rating.'});}
  if(next){const need=Math.max(1,Math.ceil(next[0]*t.cases-t.osLan-1e-9)), g=(next[1]-a.sOS)*.45;
    items.push({g,c:a.sOS<=2?'bad':a.sOS<=3?'warn':'accent',t:'Open source number: '+pc(a.os)+' (score '+a.sOS+' of 5)',
      b:'Reaching '+Math.round(next[0]*100)+'% lifts this score to '+next[1]+' and adds '+f2(g)+' to your final rating. At your current case volume that is about '+need+' more '+(need===1?'LAN':'LANs')+' with open source numbers added.'});}
  if(a.sDisc<5){const g=(5-a.sDisc)*.1;
    items.push({g,c:a.sDisc<3?'bad':'warn',t:'Discipline score: '+a.sDisc+' of 5',b:'Keep your login time and breaks within limits every day. A full score would add '+f2(g)+' to your final rating.'});}
  items.sort((x,y)=>y.g-x.g);
  if(elig) items.push({c:'good',t:'Incentive: you are eligible (Rs '+n0(a.incentive)+')',b:'All three criteria are met: open source number 12% or above, leave not more than 2 days, and daily case closure rating 3 or above (1 day below 3 allowed).'});
  else items.push({c:'warn',t:'Incentive: not eligible. Criteria not met:',list:fails});
  if(items.length===1&&elig) items.unshift({c:'good',t:'Great month',b:'All three parts are strong. Keep the same routine.'});

  // all-details table
  const C=(h,i,fm,o={})=>({h,l:o.l,f:d=>fm(d[i]),tf:o.noTot?null:(x=>fm(x[i]))});
  const all=[{h:'Day',l:1,f:()=>''},{h:'Status',l:1,f:d=>dotS(d[1]),tf:()=>''},
    C('Same-day allocated LANs',2,N), C('Closed from same-day allocated',3,N), C('Same-day coverage',4,P),
    C('Total open LANs',5,N), C('Number requirement LANs closed',6,N), C('Address requirement LANs closed',7,N), C('Paid LANs',8,N),
    C('LH reflecting LANs closed',9,N), C('LH not-reflecting LANs closed',10,N), C('Coverage',11,P),
    C('Total cases closed',12,N), C('Break time',13,N), C('Case closure rating',14,N),
    C('No-added LAN count',15,N), C('No-added count',16,N), C('No per LAN',17,R), C('Number contribution',18,P),
    C('Open source: No-added LANs',19,N), C('Open source: No-added count',20,N), C('Open source: No per LAN',21,R), C('Open source: Number contribution',22,P),
    C('BOD LAN count',23,N), C('Remarks',24,T,{l:1,noTot:1})];
  const tbl=cols=>`<div class="card tablewrap"><div class="wide"><table><tr>${cols.map(c=>`<th class="${c.l?'l':''}">${c.h}</th>`).join('')}</tr>`+
    days.map(d=>`<tr><td>${dl(d[0])}</td>${cols.slice(1).map(c=>`<td class="${c.l?'l':''}">${c.f(d)}</td>`).join('')}</tr>`).join('')+
    `<tr class="tot"><td>Month total</td>${cols.slice(1).map(c=>`<td class="${c.l?'l':''}">${c.tf?c.tf(tt):''}</td>`).join('')}</tr></table></div></div>`;

  // building blocks
  const part=(tn,title,big,ringVal,ringMax,ringLabel,desc)=>`<div class="part tone-${tn}"><div class="ringbox">${ring(ringVal,ringMax,64,7)}<b>${ringLabel}</b></div><div><div class="t">${title}</div><div class="v">${big}</div><div class="d">${desc}</div></div></div>`;
  const crit=(ok,n,val,need)=>`<div class="card crit tone-${ok?'good':'bad'}"><div class="row"><span class="n">${n}</span><span class="chip sm">${ok?'Met':'Not met'}</span></div><div class="val">${val}</div><div class="need">Needed: ${need}</div></div>`;
  const stat=(tn,ic,v,l)=>`<div class="card stat tone-${tn}"><div class="ico">${icon(ic)}</div><div><b>${v}</b><span>${l}</span></div></div>`;

  const wC=.45*a.cases, wO=.45*a.sOS, wD=.1*a.sDisc;

   <section class="hero fade">

     <div class="eyebrow">${a.label} &middot; ${a.team} team</div>
     <h1>Hi ${first}, here is your scorecard</h1>

     <div class="gauge-row tone-${tone(a.final)}">
      <div class="gauge">${ring(a.final,5,170,14)}<div class="mid"><div class="num" id="finalNum">${f2(a.final)}</div><div class="of">out of 5</div></div></div>
      <div><span class="chip">${verdict}</span><div class="formula">Final rating = 45% case closure rating + 45% open source number + 10% discipline, each scored out of 5.</div></div>
     </div>
    </div>

     ${part(tone(a.sOS),'Open source number',pc(a.os),a.sOS,5,a.sOS+'/5','45% of final &middot; adds '+f2(wO))}
     ${part(tone(a.sDisc),'Discipline',a.sDisc+' <span style="font-size:14px;color:var(--muted);font-weight:600">of 5</span>',a.sDisc,5,a.sDisc+'/5','10% of final &middot; adds '+f2(wD))}
    </div>
   </section>

   <section class="banner tone-${elig?'good':'bad'} fade" style="animation-delay:.1s">
    <div class="ic"><svg viewBox="0 0 24 24">${IC[elig?'check':'x']}</svg></div>
    <div><div class="tt">${elig?'You are eligible for incentive':'Not eligible for incentive this month'}</div>
     ${elig?'<div class="sub">All three criteria are met.</div>':`<div class="chips">${fails.map(f=>`<span class="chip sm">${f}</span>`).join('')}</div>`}</div>
    <div class="amt"><b>${elig?'Rs '+n0(a.incentive):'Rs 0'}</b><span>${elig?'Your incentive':'Incentive this month'}</span></div>
   </section>

   <section class="sect fade" style="animation-delay:.15s"><div class="head"><h2>Incentive criteria</h2><div class="sub">All three must be met to be eligible.</div></div>
    <div class="grid3">
     ${crit(okOS,'1. Open source number',pc(a.os),'12% or above')}
     ${crit(okLeave,'2. Leave days',a.leave+' days','Not more than 2 days')}
     ${crit(okRate,'3. Daily case closure rating',a.below3+' day(s) below 3','3 or above every day. 1 day below 3 is allowed')}
    </div>
    <div class="sub" style="margin-top:10px;font-size:13px">Incentive by open source number: 12%+ Rs 3,000 &middot; 15%+ Rs 4,000 &middot; 18%+ Rs 5,000 &middot; above 20% Rs 7,000.</div>
   </section>

   <section class="sect fade" style="animation-delay:.2s"><div class="head"><h2>Where to focus</h2><div class="sub">Listed by how much each one can add to your final rating.</div></div>
    <div class="focus">${items.map((i,k)=>`<div class="card fcard tone-${i.c}"><div class="no">${k+1}</div><div><div class="t">${i.t}</div>${i.list?`<ul>${i.list.map(x=>`<li>${x}</li>`).join('')}</ul>`:`<div class="b">${i.b}</div>`}</div></div>`).join('')}</div>
   </section>

   <section class="sect fade" style="animation-delay:.25s"><div class="head"><h2>Your month in numbers</h2></div>
    <div class="grid4">
     ${stat('accent','cases',n0(t.cases),'Cases closed')}
     ${stat('info','cal',worked,'Working days')}
     ${stat('good','user',present,'Days present')}
     ${stat(a.leave>2?'warn':'good','moon',a.leave,'Leave days')}
    </div>
   </section>

   <section class="sect fade" style="animation-delay:.3s"><div class="head"><h2>How your final rating is made</h2><div class="sub">The bar shows how much each part adds, out of a possible 5.</div></div>

     <div class="stack"><i class="tone-accent" style="background:var(--accent);width:${REDUCED?wC/5*100:0}%" data-w="${wC/5*100}"></i><i style="background:var(--accent2);width:${REDUCED?wO/5*100:0}%" data-w="${wO/5*100}"></i><i style="background:var(--good);width:${REDUCED?wD/5*100:0}%" data-w="${wD/5*100}"></i></div>
     <div class="legend"><span><span class="dot" style="background:var(--accent)"></span>Case closure <b>${f2(wC)}</b></span><span><span class="dot" style="background:var(--accent2)"></span>Open source <b>${f2(wO)}</b></span><span><span class="dot" style="background:var(--good)"></span>Discipline <b>${f2(wD)}</b></span><span>Final <b>${f2(a.final)}</b> of 5</span></div>
    </div>
    <div class="card tablewrap" style="margin-top:14px"><table>
     <tr><th>Part</th><th>Weight</th><th>Your result</th><th>Score (of 5)</th><th>Adds to final</th></tr>

     <tr><td><span class="dot tone-${tone(a.sOS)}"></span>Open source number</td><td>45%</td><td>${pc(a.os)}</td><td>${a.sOS}</td><td>${f2(wO)}</td></tr>
     <tr><td><span class="dot tone-${tone(a.sDisc)}"></span>Discipline (login and break)</td><td>10%</td><td>${dash}</td><td>${a.sDisc}</td><td>${f2(wD)}</td></tr>

  </div>

  <div id="t3" class="hide"><div class="head" style="margin-bottom:14px"><h2>All details</h2><div class="sub">Every column from the performance workbook. Scroll sideways to see all of them.</div></div>${tbl(all)}</div>

  return html;
}
function afterV2(a){

  $('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    [...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));
    ['t1','t3'].forEach(id=>$(id).classList.toggle('hide',id!==b.dataset.t))};

  // animate rings, bars and the big number
  if(!REDUCED){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      document.querySelectorAll('.ring-fg').forEach(c=>c.style.strokeDashoffset=c.dataset.off);
      document.querySelectorAll('.stack i').forEach(i=>i.style.width=i.dataset.w+'%');
    }));
    const el=$('finalNum'), end=a.final, t0=performance.now();
    const step=n=>{const p=Math.min(1,(n-t0)/1100), e=1-Math.pow(1-p,3); el.textContent=f2(end*e); if(p<1) requestAnimationFrame(step); else el.textContent=f2(end)};
    requestAnimationFrame(step);
  }
  window.scrollTo(0,0);
}

// ================= multi-month views =================
const ALLM = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov'];
const PAL = ['var(--accent)','var(--accent2)','var(--good)','var(--warn)','#c084fc','#fb7185','#38bdf8','#a3e635'];
let REC=null;
const gdash='<span class="z">&ndash;</span>';
const gnum = v => v===null||v===undefined||v==='' ? gdash : (Number.isInteger(v) ? n0(v) : Number(v).toFixed(2));
const gcell = (v,k) => v===null||v===undefined||v==='' ? gdash : (k==='t' ? String(v).replace(/</g,'&lt;') : k==='p' ? pc(v) : gnum(v));
const shortName = a => a.label.split(' ')[0];
const nice = h => h==='Cases Count' ? 'Case closure rating' : h;

function incInfo(m){
  if(m.v2) return {elig:m.v2.eligible==='Yes', amt:m.v2.incentive||0, known:true};
  if(m.inc && m.inc.elig!==undefined) return {elig:m.inc.elig==='Yes', amt:m.inc.amt||0, known:true};
  if(m.inc && m.inc.amt!==undefined) return {elig:null, amt:m.inc.amt||0, known:false};
  return null;
}

function monthChart(months){
  const W=760,H=260,l=42,r=18,t=28,b=32, iw=W-l-r, ih=H-t-b, N=ALLM.length;
  const x=i=>l+iw*(i+.5)/N, y=v=>t+ih*(1-v/5);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(let v=0;v<=5;v++) s+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--border)"/><text x="${l-8}" y="${y(v)+4}" font-size="11" text-anchor="end" style="fill:var(--faint)">${v}</text>`;
  s+=`<line x1="${l}" x2="${W-r}" y1="${y(3)}" y2="${y(3)}" stroke-dasharray="5 4" style="stroke:var(--bad)"/><line x1="${l}" x2="${W-r}" y1="${y(4)}" y2="${y(4)}" stroke-dasharray="5 4" style="stroke:var(--good)"/>`;
  ALLM.forEach((k,i)=>{s+=`<text x="${x(i)}" y="${H-10}" font-size="12" text-anchor="middle" style="fill:var(--muted)">${k}</text>`});
  const pts=months.map(m=>({m,i:ALLM.indexOf(m.k)})).filter(p=>p.i>=0);
  const done=pts.filter(p=>!p.m.inProg);
  if(done.length>1) s+=`<polyline fill="none" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" style="stroke:var(--accent)" points="${done.map(p=>x(p.i)+','+y(p.m.final)).join(' ')}"/>`;
  const prog=pts.filter(p=>p.m.inProg);
  if(prog.length && done.length){ const a=done[done.length-1], b=prog[0]; s+=`<line x1="${x(a.i)}" y1="${y(a.m.final)}" x2="${x(b.i)}" y2="${y(b.m.final)}" stroke-dasharray="4 4" stroke-width="2" style="stroke:var(--faint)"/>`; }
  pts.forEach(p=>{const tn=gtone(p.m.final), fill=p.m.inProg?'var(--card)':`var(--${tn})`;
    s+=`<g data-k="${p.m.k}" style="cursor:pointer"><circle cx="${x(p.i)}" cy="${y(p.m.final)}" r="8" fill="transparent"/><circle cx="${x(p.i)}" cy="${y(p.m.final)}" r="${p.m.inProg?5:6}" stroke-width="3" style="fill:${fill};stroke:var(--${tn})"><title>${p.m.label}: ${f2(p.m.final)}${p.m.inProg?' (in progress)':''}</title></circle><text x="${x(p.i)}" y="${y(p.m.final)-13}" font-size="12" font-weight="700" text-anchor="middle" style="fill:var(--text)">${f2(p.m.final)}</text></g>`});
  return s+'</svg>';
}
const gtone = v => v>=4?'good':v<3?'bad':'warn';

function viewOverview(){
  const ms=REC.months, done=ms.filter(m=>!m.inProg), first=REC.name.split(' ')[0];
  const last=done[done.length-1], best=done.reduce((b,m)=>(!b||m.final>b.final)?m:b,null);
  const avg=done.reduce((s,m)=>s+m.final,0)/Math.max(1,done.length);
  const st=(tn,ic,v,l)=>`<div class="card stat tone-${tn}"><div class="ico">${icon(ic)}</div><div><b>${v}</b><span>${l}</span></div></div>`;
  const cards=ms.slice().reverse().map(m=>{
    const tn=gtone(m.final), inc=incInfo(m);
    const itxt=!inc?'':inc.elig===true?`<span class="good">Eligible for incentive &middot; Rs ${n0(inc.amt)}</span>`:inc.elig===false?`<span class="bad">Not eligible for incentive</span>`:(inc.amt>0?`Incentive amount Rs ${n0(inc.amt)}`:'');
    return `<button type="button" class="card mcard tone-${tn}" data-k="${m.k}"><div class="mt"><b>${m.label}</b>${m.inProg?'<span class="chip sm tone-info">In progress</span>':''}</div><div class="mv">${f2(m.final)}<small> / 5</small></div><div class="mbar"><i style="width:${Math.min(100,m.final/5*100)}%"></i></div><div class="ms">${itxt||'&nbsp;'}</div><div class="go">View details &rarr;</div></button>`;}).join('');
  return `
  <section class="hero fade" style="grid-template-columns:1fr">
   <div><div class="eyebrow">2026 &middot; ${REC.team} team</div>
   <h1>Hi ${first}, here is your year so far</h1>
   <div class="sub">${REC.name}. Tap any month to see its full score details.</div></div>
   <div class="grid4">
    ${last?st(gtone(last.final),'check',f2(last.final),'Latest full month ('+shortName(last)+')'):''}
    ${best?st('good','cases',f2(best.final),'Best month ('+shortName(best)+')'):''}
    ${st(gtone(avg),'user',f2(avg),'Average of '+done.length+' full months')}
    ${st('info','cal',ms.length,'Months on record')}
   </div>
  </section>
  <section class="sect fade" style="animation-delay:.1s"><div class="head"><h2>Final rating by month</h2><div class="sub">Green line: 4 and above is excellent. Red line: below 3 needs improvement.</div></div>
   <div class="card chart" style="padding:18px 14px 10px" id="mchart">${monthChart(ms)}</div></section>
  <section class="sect fade" style="animation-delay:.2s"><div class="head"><h2>Your months</h2><div class="sub">Newest first. Tap a month to open its scorecard.</div></div>
   <div class="mgrid">${cards}</div></section>
  <div class="foot">Source: Executive Level Performance workbooks, January to November 2026. Questions on your score? Speak to your manager.</div>`;
}

function viewGeneric(m){
  const first=REC.name.split(' ')[0], mon=shortName(m), tn=gtone(m.final);
  const verdict=m.final>=4?'Excellent':m.final>=3?'Good':'Needs improvement';
  const kra=m.kra.filter(k=>k.s!==null||k.w>0).map(k=>Object.assign({},k,{n:nice(k.n)})), ok=m.ok;
  const pctW=k=>Math.round((ok?k.e:k.w)*100)+'%';
  const parts = kra.length<=5 ? `<div class="parts">${kra.map(k=>{const t=k.s===null?'accent':gtone(k.s);
    return `<div class="part tone-${t}"><div class="ringbox">${ring(k.s||0,5,64,7)}<b>${k.s===null?'-':f2(k.s)}</b></div><div><div class="t">${k.n}</div><div class="v">${k.s===null?gdash:f2(k.s)} <span style="font-size:14px;color:var(--muted);font-weight:600">of 5</span></div><div class="d">Weight ${pctW(k)}${ok&&k.s!==null?' &middot; adds '+f2(k.e*k.s):''}</div></div></div>`}).join('')}</div>` : '';
  const inc=incInfo(m);
  const banner = !inc ? '' : inc.elig===null ? (inc.amt>0?`<section class="banner tone-accent fade" style="animation-delay:.1s"><div class="ic"><svg viewBox="0 0 24 24">${IC.check}</svg></div><div><div class="tt">Incentive amount as per sheet</div></div><div class="amt"><b>Rs ${n0(inc.amt)}</b><span>${m.label}</span></div></section>`:'') :
    `<section class="banner tone-${inc.elig?'good':'bad'} fade" style="animation-delay:.1s"><div class="ic"><svg viewBox="0 0 24 24">${IC[inc.elig?'check':'x']}</svg></div><div><div class="tt">${inc.elig?'You were eligible for incentive':'Not eligible for incentive this month'}</div>${!inc.elig&&inc.amt>0?`<div class="sub">The sheet shows a slab amount of Rs ${n0(inc.amt)}, but the eligibility conditions were not all met.</div>`:''}</div><div class="amt"><b>Rs ${inc.elig?n0(inc.amt):'0'}</b><span>${inc.elig?'Your incentive':'Incentive this month'}</span></div></section>`;
  // how the rating is made
  const sum=ok?kra.reduce((s,k)=>s+k.e*(k.s||0),0):0;
  const stack = ok ? `<div class="stack">${kra.map((k,i)=>`<i style="background:${PAL[i%PAL.length]};width:${REDUCED?k.e*(k.s||0)/5*100:0}%" data-w="${k.e*(k.s||0)/5*100}"></i>`).join('')}</div><div class="legend">${kra.map((k,i)=>`<span><span class="dot" style="background:${PAL[i%PAL.length]}"></span>${k.n} <b>${f2(k.e*(k.s||0))}</b></span>`).join('')}<span>Final <b>${f2(m.final)}</b> of 5</span></div>` : '';
  const how=`<section class="sect fade" style="animation-delay:.15s"><div class="head"><h2>How your final rating is made</h2><div class="sub">${ok?'The bar shows how much each part adds, out of a possible 5.':'Weights and scores are shown exactly as in the monthly sheet.'}</div></div>
   ${ok?`<div class="card" style="padding:20px 22px">${stack}</div>`:''}
   <div class="card tablewrap" style="margin-top:14px"><div class="wide"><table><tr><th>Part</th><th>Weight</th><th>Score (of 5)</th>${ok?'<th>Adds to final</th>':''}</tr>
   ${kra.map(k=>`<tr><td><span class="dot tone-${k.s===null?'accent':gtone(k.s)}"></span>${k.n}</td><td>${pctW(k)}</td><td>${k.s===null?gdash:f2(k.s)}</td>${ok?`<td>${k.s===null?gdash:f2(k.e*k.s)}</td>`:''}</tr>`).join('')}
   ${ok?`<tr class="tot"><td>Final rating</td><td>100%</td><td></td><td>${f2(m.final)}</td></tr>`:`<tr class="tot"><td>Final rating (as per sheet)</td><td></td><td>${f2(m.final)}</td></tr>`}</table></div></div></section>`;
  // actual numbers
  const act=m.act.length?`<section class="sect fade" style="animation-delay:.2s"><div class="head"><h2>Your numbers</h2><div class="sub">The results behind your scores for ${shortName(m)}.</div></div>
   <div class="totals">${m.act.map(([h,v,p])=>`<div class="card tile"><span>${nice(h)}</span><b>${p?pc(v):gnum(v)}</b></div>`).join('')}</div></section>`:'';
  // focus
  let focus='';
  if(ok){
    const gaps=kra.filter(k=>k.s!==null&&k.s<5&&k.e>0).map(k=>({k,g:k.e*(5-k.s)})).sort((a,b)=>b.g-a.g).slice(0,3);
    const items=gaps.length?gaps.map(({k,g})=>`<div class="card fcard tone-${k.s<3?'bad':k.s<4?'warn':'accent'}"><div class="no">${gaps.findIndex(x=>x.k===k)+1}</div><div><div class="t">${k.n}: score ${f2(k.s)} of 5</div><div class="b">This part carries ${Math.round(k.e*100)}% of the final rating. Raising it to 5 would have added up to ${f2(g)}.</div></div></div>`).join('')
      :`<div class="card fcard tone-good"><div class="no">1</div><div><div class="t">Great month</div><div class="b">Every part scored 5 out of 5.</div></div></div>`;
    focus=`<section class="sect fade" style="animation-delay:.25s"><div class="head"><h2>Where to focus</h2><div class="sub">The parts that held your rating back the most that month.</div></div><div class="focus">${items}</div></section>`;
  }
  // daily table
  let det='';
  if(m.daily && m.daily.cols.length){
    const d=m.daily, hdr=['Day',...d.cols.map(c=>c[0])], kinds=['n',...d.cols.map(c=>c[1])];
    det=`<section class="sect fade" style="animation-delay:.3s"><div class="head"><h2>All details</h2><div class="sub">Every day's figures from the performance workbook. Scroll sideways to see all columns.</div></div>
     <div class="card tablewrap"><div class="wide"><table><tr>${hdr.map((h,i)=>`<th class="${kinds[i]==='t'?'l':''}">${h}</th>`).join('')}</tr>
     ${d.rows.map(r=>`<tr><td>${r[0]} ${mon}</td>${r.slice(1).map((v,i)=>`<td class="${kinds[i+1]==='t'?'l':''}">${gcell(v,kinds[i+1])}</td>`).join('')}</tr>`).join('')}
     ${d.tot?`<tr class="tot"><td>Month total</td>${d.tot.slice(1).map((v,i)=>`<td class="${kinds[i+1]==='t'?'l':''}">${kinds[i+1]==='t'?'':gcell(v,kinds[i+1])}</td>`).join('')}</tr>`:''}</table></div></div></section>`;
  }
  return `
  <section class="hero fade" style="${parts?'':'grid-template-columns:1fr'}">
   <div><div class="eyebrow">${m.label} &middot; ${REC.team} team</div>
    <h1>Hi ${first}, here is your ${mon} scorecard</h1><div class="sub">${REC.name}</div>
    <div class="gauge-row tone-${tn}"><div class="gauge">${ring(m.final,5,170,14)}<div class="mid"><div class="num" id="finalNum">${f2(m.final)}</div><div class="of">out of 5</div></div></div>
     <div><span class="chip">${verdict}</span><div class="formula">Final rating for ${m.label}, as calculated in your monthly performance sheet.</div></div></div></div>
   ${parts}
  </section>
  ${banner}${how}${act}${focus}${det}
  <div class="foot">Source: Executive Level Performance workbook, ${m.label}. Questions on your score? Speak to your manager.</div>`;
}

function afterGeneric(m){
  if(REDUCED) return;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('.ring-fg').forEach(c=>c.style.strokeDashoffset=c.dataset.off);
    document.querySelectorAll('.stack i').forEach(i=>i.style.width=i.dataset.w+'%');
  }));
  const el=$('finalNum'); if(!el) return; const end=m.final, t0=performance.now();
  const step=n=>{const p=Math.min(1,(n-t0)/1100), e=1-Math.pow(1-p,3); el.textContent=f2(end*e); if(p<1) requestAnimationFrame(step); else el.textContent=f2(end)};
  requestAnimationFrame(step);
}

function showView(key){
  const ms=REC.months;
  const pill=(k,label,tn)=>`<button type="button" class="pill ${k===key?'on':''}" data-k="${k}">${tn?`<span class="dot tone-${tn}"></span>`:''}${label}</button>`;
  const nav=`<div class="mnav" id="mnav">${pill('ov','Overview')}${ms.map(m=>pill(m.k,m.k+(m.inProg?'*':''),gtone(m.final))).join('')}</div>`;
  let body, after=()=>{};
  const m=ms.find(x=>x.k===key);
  if(key==='ov'||!m) body=viewOverview();
  else if(m.v2){ MON=m.k; const a=Object.assign({name:REC.name,team:REC.team,label:m.label,inProg:m.inProg},m.v2); body=v2(a); after=()=>afterV2(a); }
  else { MON=m.k; body=viewGeneric(m); after=()=>afterGeneric(m); }
  $('app').innerHTML=nav+`<div id="view">${body}</div>`;
  $('app').onclick=e=>{const b=e.target.closest('[data-k]'); if(b) showView(b.dataset.k)};
  after();
  window.scrollTo(0,0);
}

function render(rec){
  rec.months=rec.months.filter(m=>m.final!==null&&m.final!==undefined);
  REC=rec;
  $('login').classList.add('hide'); $('app').classList.remove('hide'); $('lock').classList.remove('hide');
  showView('ov');
}
</script>
</body>
</html>
