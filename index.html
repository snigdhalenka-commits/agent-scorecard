<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>My Performance Scorecard</title>
<style>
:root{--bg:#fff;--fg:#1c2230;--mut:#5f6b82;--line:#dfe4ee;--soft:#f4f6fb;--acc:#2f5597;--good:#1e8e3e;--warn:#b26a00;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#161a22;--fg:#e6e9f0;--mut:#9aa6bd;--line:#2b3242;--soft:#1e2430;--acc:#7da2e6;--good:#5fd38a;--warn:#e8b45a;--bad:#ff8a7a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:28px 0 10px}
.mut{color:var(--mut)}.small{font-size:12px}
.login{max-width:380px;margin:12vh auto 0;border:1px solid var(--line);border-radius:10px;padding:24px}
label{display:block;font-size:12px;color:var(--mut);margin:14px 0 4px}
select,input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
button{margin-top:18px;padding:9px 16px;border:0;border-radius:6px;background:var(--acc);color:var(--bg);font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);margin:0}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);margin-top:12px;min-height:20px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.card{background:var(--soft);border-radius:8px;padding:12px 14px}
.card .v{font-size:24px;font-weight:700}.card .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600;font-size:12px}
tr.tot td{font-weight:700;background:var(--soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
svg{width:100%;height:auto;display:block}
.scroll{overflow-x:auto;max-height:420px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="login">
  <h1>Performance Scorecard</h1>
  <div class="mut small">October 2026. Select your name and enter the password you were given. Your data is decrypted only in this browser.</div>
  <label for="who">Your name</label>
  <select id="who"></select>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="off" placeholder="xxxx-xxxx-xxxx">
  <button id="go">View my scorecard</button>
  <div id="err" class="err"></div>
</div>
<div id="app" class="hide"></div>
</div>

const ITER = 600000;
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const names = Object.keys(ENC).sort();
$('who').innerHTML = names.map(n => `<option>${n}</option>`).join('');

async function decrypt(name, password){
  const e = ENC[name];
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(e.s), iterations:ITER, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(e.i)}, key, b64(e.c));
  return JSON.parse(new TextDecoder().decode(buf));
}

$('go').onclick = async () => {
  $('err').textContent = '';
  if (!window.crypto || !crypto.subtle) { $('err').textContent = 'This browser cannot decrypt here. Open the file in Chrome, Edge or Safari (or over https).'; return; }
  const pw = $('pw').value;
  if (!pw) { $('err').textContent = 'Enter your password.'; return; }
  $('go').disabled = true; $('go').textContent = 'Checking...';
  try { render(await decrypt($('who').value, pw)); }
  catch (e) { $('err').textContent = 'Wrong password for this name. Please try again.'; }
  $('go').disabled = false; $('go').textContent = 'View my scorecard';
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });

const f2 = x => Number(x).toFixed(2), pc = x => (x*100).toFixed(1) + '%', n0 = x => Number(x).toLocaleString('en-US');
const cls = v => v >= 4 ? 'good' : v < 3 ? 'bad' : 'warn';
const dl = d => d + ' Oct';

function barSvg(days){
  const W=480,H=200,l=34,b=26,t=10,r=8, iw=W-l-r, ih=H-t-b;
  const max=Math.max(1,...days.map(d=>d[2])), bw=iw/days.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cases closed per day">`;
  for(let i=0;i<=4;i++){const y=t+ih-ih*i/4;s+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${l-4}" y="${y+4}" font-size="10" text-anchor="end" fill="var(--mut)">${Math.round(max*i/4)}</text>`}
  days.forEach((d,i)=>{const h=ih*d[2]/max;s+=`<rect x="${l+i*bw+1}" y="${t+ih-h}" width="${Math.max(1,bw-2)}" height="${h}" fill="var(--acc)"><title>${dl(d[0])}: ${d[2]} cases</title></rect>`;
    if(i%2===0)s+=`<text x="${l+i*bw+bw/2}" y="${H-10}" font-size="9" text-anchor="middle" fill="var(--mut)">${d[0]}</text>`});
  return s+`<text x="${W/2}" y="${H}" font-size="10" text-anchor="middle" fill="var(--mut)">Day of October</text></svg>`;
}
function lineSvg(days){
  const rd=days.filter(d=>d[3]!==null); if(!rd.length) return '<div class="mut small">No rated days yet.</div>';
  const W=480,H=200,l=34,b=26,t=10,r=8, iw=W-l-r, ih=H-t-b, max=Math.max(5,...rd.map(d=>d[3]));
  const x=i=>l+(rd.length===1?iw/2:iw*i/(rd.length-1)), y=v=>t+ih-ih*v/max;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily case closure rating">`;
  for(let v=0;v<=max;v++){s+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l-4}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--mut)">${v}</text>`}
  s+=`<line x1="${l}" x2="${W-r}" y1="${y(3)}" y2="${y(3)}" stroke="var(--bad)" stroke-dasharray="4 3"/><text x="${W-r}" y="${y(3)-3}" font-size="9" text-anchor="end" fill="var(--bad)">Below-3 line</text>`;
  s+=`<polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${rd.map((d,i)=>x(i)+','+y(d[3])).join(' ')}"/>`;
  rd.forEach((d,i)=>{s+=`<circle cx="${x(i)}" cy="${y(d[3])}" r="3" fill="var(--acc)"><title>${dl(d[0])}: ${d[3]}</title></circle>`});
  return s+`<text x="${W/2}" y="${H}" font-size="10" text-anchor="middle" fill="var(--mut)">Days with a rating</text></svg>`;
}

function render(a){
  const t=a.tot, days=a.days;
  const present=days.filter(d=>d[1]&&String(d[1]).toLowerCase().startsWith('present')).length;
  const active=days.filter(d=>d[2]>0).length;
  const verdict=a.final>=4?'Excellent':a.final>=3?'Good':'Needs improvement';
  $('login').classList.add('hide');
  $('app').classList.remove('hide');
  $('app').innerHTML=`
  <div class="top"><div><h1>${a.name}</h1><div class="mut">October 2026 &middot; ${a.team} team &middot; <span class="${cls(a.final)}">${verdict}</span></div></div>
  <button class="ghost" onclick="location.reload()">Lock</button></div>
  <div class="cards">
   <div class="card"><div class="v ${cls(a.final)}">${f2(a.final)}</div><div class="l">Final rating (of 5)</div></div>
   <div class="card"><div class="v">${f2(a.cases)}</div><div class="l">Cases rating</div></div>
   <div class="card"><div class="v">${pc(a.os)}</div><div class="l">Open source number %</div></div>
   <div class="card"><div class="v">${n0(t.cases)}</div><div class="l">Cases closed</div></div>
   <div class="card"><div class="v">${present}</div><div class="l">Days present</div></div>
   <div class="card"><div class="v">${a.leave}</div><div class="l">Leave days</div></div>
  </div>
  <h2>KRA scorecard</h2>
  <table><tr><th>KRA</th><th>Weight</th><th>Actual</th><th>Score</th><th>Weighted</th></tr>
   <tr><td>Cases count (avg daily case closure rating)</td><td>45%</td><td>${f2(a.cases)}</td><td>${f2(a.cases)}</td><td>${f2(.45*a.cases)}</td></tr>
   <tr><td>% Open source number contribution</td><td>45%</td><td>${pc(a.os)}</td><td>${a.sOS}</td><td>${f2(.45*a.sOS)}</td></tr>
   <tr><td>Discipline (login and break)</td><td>10%</td><td>-</td><td>${a.sDisc}</td><td>${f2(.1*a.sDisc)}</td></tr>
   <tr class="tot"><td>Final rating</td><td>100%</td><td></td><td></td><td>${f2(a.final)}</td></tr></table>
  <div class="mut small" style="margin-top:6px">Open source score: 20%+ = 5, 15%+ = 4, 12%+ = 3, 8%+ = 2, below 8% = 1.</div>
  <div class="grid2"><div><h2>Cases closed per day</h2>${barSvg(days)}</div><div><h2>Daily case closure rating</h2>${lineSvg(days)}</div></div>
  <h2>Monthly activity</h2>
  <table>
   <tr><td>Same day allocated LANs</td><td>${n0(t.sdAlloc)}</td><td>Closed from same day allocated</td><td>${n0(t.sdClosed)}</td></tr>
   <tr><td>Same day coverage</td><td>${pc(t.sdCov)}</td><td>Coverage (LH reflecting / open LANs)</td><td>${pc(t.cov)}</td></tr>
   <tr><td>Total open LANs (sum of days)</td><td>${n0(t.openLan)}</td><td>Number requirement LANs closed</td><td>${n0(t.numReq)}</td></tr>
   <tr><td>Open source No-added LANs</td><td>${n0(t.osLan)}</td><td>Active days (closed cases)</td><td>${active}</td></tr>
   <tr><td>Days rated below 3</td><td>${a.below3}</td><td>Incentive</td><td>${a.incentive?'Rs '+n0(a.incentive):'None'}${a.incentive?(a.eligible==='Yes'?' (eligible)':' (not eligible)'):''}</td></tr>
  </table>
  <h2>Daily log</h2>
  <div class="scroll"><table><tr><th>Day</th><th>Status</th><th>Cases closed</th><th>Rating</th><th>Open source LANs</th><th>Coverage</th><th>Break hrs</th><th style="text-align:left">Remarks</th></tr>
  ${days.map(d=>`<tr><td>${dl(d[0])}</td><td>${d[1]??''}</td><td>${d[2]}</td><td>${d[3]??''}</td><td>${d[4]}</td><td>${d[7]===null?'':pc(d[7])}</td><td>${d[8]??''}</td><td style="text-align:left">${(d[9]??'').toString().replace(/</g,'&lt;')}</td></tr>`).join('')}
  </table></div>
  <div class="mut small" style="margin-top:16px">Source: Executive Level Performance workbook, October 2026. Questions on your score? Speak to your manager.</div>`;
}
</script>
</body>
