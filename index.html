<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>My Performance Scorecard</title>
<style>
:root{--bg:#fff;--fg:#1c2230;--mut:#5f6b82;--line:#dfe4ee;--soft:#f4f6fb;--acc:#2f5597;--good:#1e8e3e;--warn:#b26a00;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#161a22;--fg:#e6e9f0;--mut:#9aa6bd;--line:#2b3242;--soft:#1e2430;--acc:#7da2e6;--good:#5fd38a;--warn:#e8b45a;--bad:#ff8a7a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:28px 0 10px}
.mut{color:var(--mut)}.small{font-size:12px}
.login{max-width:380px;margin:12vh auto 0;border:1px solid var(--line);border-radius:10px;padding:24px}
label{display:block;font-size:12px;color:var(--mut);margin:14px 0 4px}
select,input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
button{margin-top:18px;padding:9px 16px;border:0;border-radius:6px;background:var(--acc);color:var(--bg);font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);margin:0}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);margin-top:12px;min-height:20px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.card{background:var(--soft);border-radius:8px;padding:12px 14px}
.card .v{font-size:24px;font-weight:700}.card .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600;font-size:12px}
tr.tot td{font-weight:700;background:var(--soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
svg{width:100%;height:auto;display:block}
.scroll{overflow-x:auto;max-height:420px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.hide{display:none}

.hero{display:flex;gap:20px;align-items:center;background:var(--soft);border-radius:12px;padding:20px;margin-top:16px;flex-wrap:wrap}
.hero .big{font-size:56px;font-weight:800;line-height:1}.hero .of{font-size:16px;color:var(--mut);font-weight:600}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px;min-width:200px}.bar>i{display:block;height:100%;background:var(--acc)}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.k{border:1px solid var(--line);border-radius:10px;padding:14px 16px}.k .t{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.k .v{font-size:30px;font-weight:700;margin:4px 0}.k .d{font-size:12px;color:var(--mut)}
.tabs{display:flex;gap:6px;margin:24px 0 8px;border-bottom:1px solid var(--line)}
.tabs button{margin:0;background:transparent;color:var(--mut);border-radius:6px 6px 0 0;padding:9px 14px;font-weight:600;border:0;border-bottom:3px solid transparent}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.wide{overflow-x:auto;border:1px solid var(--line);border-radius:8px}.wide table{min-width:max-content}
.wide th{position:sticky;top:0;background:var(--bg);white-space:normal;min-width:70px}
.wide td:first-child,.wide th:first-child{position:sticky;left:0;background:var(--bg);z-index:1}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--soft)}.chip.p{background:rgba(30,142,62,.15);color:var(--good)}.chip.l{background:rgba(178,106,0,.15);color:var(--warn)}
td.z{color:var(--mut)}
.mt td:nth-child(3){text-align:left;padding-left:28px}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="login">
  <h1>Performance Scorecard</h1>
  <div class="mut small">October 2026. Select your name and enter the password you were given. Your data is decrypted only in this browser.</div>
  <label for="who">Your name</label>
  <select id="who"></select>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="off" placeholder="xxxx-xxxx-xxxx">
  <button id="go">View my scorecard</button>
  <div id="err" class="err"></div>
</div>
<div id="app" class="hide"></div>
</div>

const ITER = 600000;
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const names = Object.keys(ENC).sort();
$('who').innerHTML = names.map(n => `<option>${n}</option>`).join('');

async function decrypt(name, password){
  const e = ENC[name];
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(e.s), iterations:ITER, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(e.i)}, key, b64(e.c));
  return JSON.parse(new TextDecoder().decode(buf));
}

$('go').onclick = async () => {
  $('err').textContent = '';
  if (!window.crypto || !crypto.subtle) { $('err').textContent = 'This browser cannot decrypt here. Open the file in Chrome, Edge or Safari (or over https).'; return; }
  const pw = $('pw').value;
  if (!pw) { $('err').textContent = 'Enter your password.'; return; }
  $('go').disabled = true; $('go').textContent = 'Checking...';
  try { render(await decrypt($('who').value, pw)); }
  catch (e) { $('err').textContent = 'Wrong password for this name. Please try again.'; }
  $('go').disabled = false; $('go').textContent = 'View my scorecard';
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });

const f2 = x => Number(x).toFixed(2), pc = x => (x*100).toFixed(1) + '%', n0 = x => Number(x).toLocaleString('en-US');
const cls = v => v >= 4 ? 'good' : v < 3 ? 'bad' : 'warn';
const dl = d => d + ' Oct';

function barSvg(days){
  const W=480,H=200,l=34,b=26,t=10,r=8, iw=W-l-r, ih=H-t-b;
  const max=Math.max(1,...days.map(d=>(d[12]||0))), bw=iw/days.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cases closed per day">`;
  for(let i=0;i<=4;i++){const y=t+ih-ih*i/4;s+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${l-4}" y="${y+4}" font-size="10" text-anchor="end" fill="var(--mut)">${Math.round(max*i/4)}</text>`}
  days.forEach((d,i)=>{const h=ih*(d[12]||0)/max;s+=`<rect x="${l+i*bw+1}" y="${t+ih-h}" width="${Math.max(1,bw-2)}" height="${h}" fill="var(--acc)"><title>${dl(d[0])}: ${(d[12]||0)} cases</title></rect>`;
    if(i%2===0)s+=`<text x="${l+i*bw+bw/2}" y="${H-10}" font-size="9" text-anchor="middle" fill="var(--mut)">${d[0]}</text>`});
  return s+`<text x="${W/2}" y="${H}" font-size="10" text-anchor="middle" fill="var(--mut)">Day of October</text></svg>`;
}
function lineSvg(days){
  const rd=days.filter(d=>d[14]!==null); if(!rd.length) return '<div class="mut small">No rated days yet.</div>';
  const W=480,H=200,l=34,b=26,t=10,r=8, iw=W-l-r, ih=H-t-b, max=Math.max(5,...rd.map(d=>d[14]));
  const x=i=>l+(rd.length===1?iw/2:iw*i/(rd.length-1)), y=v=>t+ih-ih*v/max;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily case closure rating">`;
  for(let v=0;v<=max;v++){s+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l-4}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--mut)">${v}</text>`}
  s+=`<line x1="${l}" x2="${W-r}" y1="${y(3)}" y2="${y(3)}" stroke="var(--bad)" stroke-dasharray="4 3"/><text x="${W-r}" y="${y(3)-3}" font-size="9" text-anchor="end" fill="var(--bad)">Below-3 line</text>`;
  s+=`<polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${rd.map((d,i)=>x(i)+','+y(d[14])).join(' ')}"/>`;
  rd.forEach((d,i)=>{s+=`<circle cx="${x(i)}" cy="${y(d[14])}" r="3" fill="var(--acc)"><title>${dl(d[0])}: ${d[14]}</title></circle>`});
  return s+`<text x="${W/2}" y="${H}" font-size="10" text-anchor="middle" fill="var(--mut)">Days with a rating</text></svg>`;
}

  const R=x=>V(x,x=>Number(x).toFixed(2)), P=x=>V(x,pc), N=x=>V(x), T=x=>x?String(x).replace(/</g,'&lt;'):dash;
  const chip=s=>{const l=String(s||'').toLowerCase();return `<span class="chip ${l.startsWith('present')?'p':'l'}">${s||''}</span>`};

  $('app').classList.remove('hide');
  const tbl=(cols,withTot)=>`<div class="wide"><table><tr>${cols.map(c=>`<th${c.l?' style="text-align:left"':''}>${c.h}</th>`).join('')}</tr>`+

    (withTot?`<tr class="tot"><td>Month total</td>${cols.slice(1).map(c=>`<td${c.l?' style="text-align:left"':''}>${c.tf?c.tf(tt):''}</td>`).join('')}</tr>`:'')+`</table></div>`;
  const C=(h,i,fm,o={})=>({h,l:o.l,f:d=>fm(d[i]),tf:o.noTot?null:(x=>fm(x[i]))});
  const daily=[
    {h:'Day',f:()=>''},
    {h:'Status',l:1,f:d=>chip(d[1]),tf:()=>''},
    C('Cases closed',12,N), C('Rating (of 5)',14,N),
    C('Open source LANs',19,N), C('Coverage',11,P),
    C('Break time',13,N), C('Remarks',24,T,{l:1,noTot:1})];
  const all=[
    {h:'Day',f:()=>''},
    {h:'Status',l:1,f:d=>chip(d[1]),tf:()=>''},
    C('Same-day allocated LANs',2,N), C('Closed from same-day allocated',3,N), C('Same-day coverage',4,P),
    C('Total open LANs',5,N), C('Number requirement LANs closed',6,N), C('Address requirement LANs closed',7,N), C('Paid LANs',8,N),
    C('LH reflecting LANs closed',9,N), C('LH not-reflecting LANs closed',10,N), C('Coverage',11,P),
    C('Total cases closed',12,N), C('Break time',13,N), C('Case closure rating',14,N),
    C('No-added LAN count',15,N), C('No-added count',16,N), C('No per LAN',17,R), C('Number contribution',18,P),
    C('Open source: No-added LANs',19,N), C('Open source: No-added count',20,N), C('Open source: No per LAN',21,R), C('Open source: Number contribution',22,P),
    C('BOD LAN count',23,N), C('Remarks',24,T,{l:1,noTot:1})];
  const card=(c,v,l)=>`<div class="card"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  $('app').innerHTML=`
  <div class="top"><div><h1>${a.name}</h1><div class="mut">October 2026 &middot; ${a.team} team</div></div>
  <button class="ghost" onclick="location.reload()">Lock</button></div>
  <div class="hero"><div><div class="big ${cls(a.final)}">${f2(a.final)} <span class="of">out of 5</span></div>
   <div style="font-weight:600;margin-top:4px" class="${cls(a.final)}">${verdict}</div></div>
   <div style="flex:1;min-width:220px"><div class="small mut">Your final rating this month</div><div class="bar"><i style="width:${Math.min(100,a.final/5*100)}%"></i></div></div></div>
  <div class="three">
   <div class="k"><div class="t">1. Cases closed rating &middot; 45%</div><div class="v ${cls(a.cases)}">${f2(a.cases)}</div><div class="d">Average of your daily case closure ratings. ${n0(t.cases)} cases closed in ${worked} working days.</div></div>
   <div class="k"><div class="t">2. Open source number &middot; 45%</div><div class="v ${cls(a.sOS)}">${pc(a.os)}</div><div class="d">Score ${a.sOS} out of 5. Scale: 20%+ = 5, 15%+ = 4, 12%+ = 3, 8%+ = 2, below 8% = 1.</div></div>
   <div class="k"><div class="t">3. Discipline &middot; 10%</div><div class="v ${cls(a.sDisc)}">${a.sDisc}</div><div class="d">Based on login and break discipline.</div></div>
  </div>
  <div class="mut small" style="margin-top:10px">Final rating = 45% &times; ${f2(a.cases)} + 45% &times; ${a.sOS} + 10% &times; ${a.sDisc} = <b>${f2(a.final)}</b></div>

  <div class="tabs" id="tabs"><button class="on" data-t="t1">Summary</button><button data-t="t2">Day by day</button><button data-t="t3">All details</button></div>

  <div id="t1">
   <div class="cards">
    ${card(0,n0(t.cases),'Cases closed')}${card(0,worked,'Working days')}${card(0,present,'Days present')}${card(0,a.leave,'Leave days')}
    ${card(0,a.below3,'Days rated below 3')}${card(0,a.incentive?'Rs '+n0(a.incentive):'None','Incentive'+(a.incentive?(a.eligible==='Yes'?' (eligible)':' (not eligible)'):''))}
   </div>
   <div class="grid2"><div><h2>Cases closed per day</h2>${barSvg(days)}</div><div><h2>Daily case closure rating</h2>${lineSvg(days)}</div></div>
   <h2>Month totals</h2>
   <table class="mt">
    <tr><td>Same-day allocated LANs</td><td>${N(t.sdAlloc)}</td><td>Closed from same-day allocated</td><td>${N(t.sdClosed)}</td></tr>
    <tr><td>Same-day coverage</td><td>${P(t.sdCov)}</td><td>Coverage (LH reflecting / open LANs)</td><td>${P(t.cov)}</td></tr>
    <tr><td>Total open LANs (sum of days)</td><td>${N(t.openLan)}</td><td>Number requirement LANs closed</td><td>${N(t.numReq)}</td></tr>
    <tr><td>Address requirement LANs closed</td><td>${N(t.addrReq)}</td><td>Paid LANs</td><td>${N(t.paid)}</td></tr>
    <tr><td>Open source No-added LANs</td><td>${N(t.osLan)}</td><td>Open source No-added count</td><td>${N(t.osCnt)}</td></tr>
    <tr><td>LH reflecting LANs closed</td><td>${N(t.lhRefl)}</td><td>BOD LAN count</td><td>${N(t.bod)}</td></tr>
   </table>
  </div>

  <div id="t2" class="hide"><h2>Day by day</h2>${tbl(daily,true)}
   <div class="mut small" style="margin-top:6px">A dash means there was no entry for that day (for example no cases closed, or leave).</div></div>

  <div id="t3" class="hide"><h2>All details</h2><div class="mut small" style="margin-bottom:8px">Every column from the performance workbook. Scroll sideways to see all of them.</div>${tbl(all,true)}</div>

  <div class="mut small" style="margin-top:16px">Source: Executive Level Performance workbook, October 2026. Questions on your score? Speak to your manager.</div>`;
  $('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    [...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));
    ['t1','t2','t3'].forEach(id=>$(id).classList.toggle('hide',id!==b.dataset.t))};
}
</script>
</body>
</html>
